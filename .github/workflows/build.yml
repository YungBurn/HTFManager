name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HTFManager.slnx

      - name: Build
        run: dotnet build HTFManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/HTFManager.Tests/HTFManager.Tests.csproj --configuration Release --no-build --no-restore
