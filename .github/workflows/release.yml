name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Release tag ${{ github.ref_name }} does not match VERSION ($expected)."
          }

      - name: Restore
        run: dotnet restore HTFManager.slnx

      - name: Build
        run: dotnet build HTFManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/HTFManager.Tests/HTFManager.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish win-x64 single-file executable
        shell: pwsh
        run: ./build/publish-win-x64.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTFManager-win-x64
          path: artifacts/release/v*/**
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not (gh release view $tag 2>$null)) {
            $notesFile = "PATCH_NOTES_$tag.md"
            if (Test-Path $notesFile) {
              gh release create $tag --verify-tag --title "HTF Manager $tag" --notes-file $notesFile
            } else {
              gh release create $tag --verify-tag --title "HTF Manager $tag" --generate-notes
            }
          }
          $assets = Get-ChildItem "artifacts/release" -Recurse -File
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --clobber
          }
          gh release edit $tag --latest
